<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <filter id="boxShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="980" height="720" rx="14" fill="#030712" />

  <g transform="translate(20, 20)" filter="url(#boxShadow)">
    <rect width="940" height="680" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    
    <!-- GitHub UI Top Nav -->
    <rect width="940" height="52" rx="10" fill="#161b22"/>
    <rect y="42" width="940" height="10" fill="#161b22"/>
    
    <!-- GitHub Logo / Icon Simulation -->
    <circle cx="30" cy="26" r="14" fill="#238636"/>
    <path d="M 24 26 L 28 30 L 37 21" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="56" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">Java Spring Boot CI (Gradle) / Run Unit Tests</text>
    <text x="56" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#8b949e">Commit: feat: initialize automated unit test workflow • Branch: main • Workflow Run 1</text>
    
    <!-- Status badge -->
    <rect x="825" y="14" width="95" height="26" rx="13" fill="#238636"/>
    <text x="872" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Success</text>

    <!-- Main Content Grid -->
    <g transform="translate(20, 70)">
      <!-- Left Sidebar: Steps List -->
      <g transform="translate(0, 0)">
        <rect width="280" height="570" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text x="15" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#8b949e">JOBS &amp; STEPS</text>
        <line x1="0" y1="40" x2="280" y2="40" stroke="#30363d"/>

        <!-- Step Items -->
        <!-- Step 1: Set up job -->
        <g transform="translate(15, 55)">
          <circle cx="10" cy="10" r="7" fill="#238636"/>
          <path d="M 7 10 L 9 12 L 13 8" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
          <text x="26" y="14" font-family="sans-serif" font-size="11" fill="#c9d1d9">Set up job</text>
          <text x="250" y="14" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">2s</text>
        </g>

        <!-- Step 2: Checkout -->
        <g transform="translate(15, 95)">
          <circle cx="10" cy="10" r="7" fill="#238636"/>
          <path d="M 7 10 L 9 12 L 13 8" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
          <text x="26" y="14" font-family="sans-serif" font-size="11" fill="#c9d1d9">Checkout mã nguồn</text>
          <text x="250" y="14" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">1s</text>
        </g>

        <!-- Step 3: Setup Java -->
        <g transform="translate(15, 135)">
          <circle cx="10" cy="10" r="7" fill="#238636"/>
          <path d="M 7 10 L 9 12 L 13 8" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
          <text x="26" y="14" font-family="sans-serif" font-size="11" fill="#c9d1d9">Thiết lập Java JDK 17</text>
          <text x="250" y="14" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">3s</text>
        </g>

        <!-- Step 4: Chmod -->
        <g transform="translate(15, 175)">
          <circle cx="10" cy="10" r="7" fill="#238636"/>
          <path d="M 7 10 L 9 12 L 13 8" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
          <text x="26" y="14" font-family="sans-serif" font-size="11" fill="#c9d1d9">Cấp quyền Gradle Wrapper</text>
          <text x="250" y="14" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">1s</text>
        </g>

        <!-- Step 5: Run Test (Active) -->
        <g transform="translate(15, 215)">
          <rect x="-8" y="-4" width="265" height="32" rx="6" fill="#1f6feb" fill-opacity="0.15" stroke="#388bfd" stroke-width="1"/>
          <circle cx="10" cy="11" r="7" fill="#238636"/>
          <path d="M 7 11 L 9 13 L 13 9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
          <text x="26" y="15" font-family="sans-serif" font-size="11" font-weight="700" fill="#58a6ff">Thực thi JUnit Test</text>
          <text x="250" y="15" font-family="sans-serif" font-size="10" fill="#58a6ff" text-anchor="end">28s</text>
        </g>

        <!-- Step 6: Complete job -->
        <g transform="translate(15, 260)">
          <circle cx="10" cy="10" r="7" fill="#238636"/>
          <path d="M 7 10 L 9 12 L 13 8" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
          <text x="26" y="14" font-family="sans-serif" font-size="11" fill="#c9d1d9">Complete job</text>
          <text x="250" y="14" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">1s</text>
        </g>
      </g>

      <!-- Right Main: Terminal Execution Log of ./gradlew test -->
      <g transform="translate(295, 0)">
        <rect width="605" height="570" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
        
        <!-- Log Header -->
        <rect width="605" height="36" rx="8" fill="#161b22"/>
        <rect y="26" width="605" height="10" fill="#161b22"/>
        <text x="15" y="23" font-family="monospace" font-size="11" fill="#8b949e">Run ./gradlew test</text>
        <text x="590" y="23" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">Total duration: 36s</text>

        <!-- Log Text -->
        <g transform="translate(15, 52)" font-family="'Fira Code', 'JetBrains Mono', 'Courier New', monospace" font-size="11.5">
          <text y="15" fill="#58a6ff">Run ./gradlew test</text>
          <text y="35" fill="#8b949e">Downloading https://services.gradle.org/distributions/gradle-8.5-bin.zip</text>
          <text y="53" fill="#8b949e">..........10%..........20%..........30%..........100%</text>
          <text y="71" fill="#8b949e">Welcome to Gradle 8.5!</text>
          
          <text y="97" fill="#e6edf3">&gt; Task :compileJava</text>
          <text y="115" fill="#e6edf3">&gt; Task :processResources</text>
          <text y="133" fill="#e6edf3">&gt; Task :classes</text>
          <text y="151" fill="#e6edf3">&gt; Task :compileTestJava</text>
          <text y="169" fill="#e6edf3">&gt; Task :processTestResources</text>
          <text y="187" fill="#e6edf3">&gt; Task :testClasses</text>
          <text y="205" fill="#e6edf3">&gt; Task :test</text>

          <!-- Spring Boot ASCII Banner simulation -->
          <text y="235" fill="#3fb950" font-weight="bold">  .   ____          _            __ _ _</text>
          <text y="251" fill="#3fb950" font-weight="bold"> /\\ / ___'_ __ _ _(_)_ __  __ _ \ \ \ \</text>
          <text y="267" fill="#3fb950" font-weight="bold">( ( )\___ | '_ | '_| | '_ \/ _` | \ \ \ \</text>
          <text y="283" fill="#3fb950" font-weight="bold"> \\/  ___)| |_)| | | | | || (_| |  ) ) ) )</text>
          <text y="299" fill="#3fb950" font-weight="bold">  '  |____| .__|_| |_|_| |_\__, | / / / /</text>
          <text y="315" fill="#3fb950" font-weight="bold"> (Spring Boot Application Testing Framework)</text>
          
          <text y="340" fill="#8b949e">2026-10-13T03:50:10.123Z INFO Starting DemoApplicationTests using Java 17</text>
          <text y="358" fill="#8b949e">2026-10-13T03:50:11.456Z INFO Started DemoApplicationTests in 1.345 seconds</text>

          <text y="388" fill="#3fb950" font-weight="bold">DemoApplicationTests &gt; testIndexEndpoint() PASSED</text>
          <text y="408" fill="#3fb950" font-weight="bold">DemoApplicationTests &gt; contextLoads() PASSED</text>

          <rect x="0" y="425" width="575" height="42" rx="6" fill="#1f6feb" fill-opacity="0.1" stroke="#238636" stroke-width="1"/>
          <text x="15" y="451" fill="#3fb950" font-size="12.5" font-weight="bold">BUILD SUCCESSFUL in 18s</text>
          <text x="210" y="451" fill="#8b949e" font-size="11">4 actionable tasks: 4 executed</text>

          <text y="492" fill="#8b949e">Test results saved in build/reports/tests/test/index.html</text>
        </g>
      </g>
    </g>
  </g>
</svg>
