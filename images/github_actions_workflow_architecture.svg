<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="runGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="okGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1000" height="620" fill="url(#bgGrad)" rx="16"/>

  <rect x="25" y="20" width="950" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="500" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc" text-anchor="middle">KIẾN TRÚC GITHUB ACTIONS CI CHO JAVA SPRING BOOT VỚI GRADLE</text>
  <text x="500" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Trigger on push main • Runner ubuntu-latest • actions/setup-java@v5 (JDK 17 Temurin) • ./gradlew test</text>

  <!-- Step 1: Git Push Event -->
  <g transform="translate(35, 105)">
    <rect width="210" height="380" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="210" height="40" rx="12" fill="url(#gitGrad)"/>
    <text x="105" y="26" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1. GIT EVENT TRIGGER</text>

    <g transform="translate(12, 55)">
      <rect width="186" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="93" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#fda4af" text-anchor="middle">Developer Git Push</text>
      <text x="93" y="44" font-family="monospace" font-size="9" fill="#f1f5f9" text-anchor="middle">git push origin main</text>
      <text x="93" y="62" font-family="sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">Nhánh theo dõi: main</text>
    </g>

    <g transform="translate(12, 150)">
      <rect width="186" height="205" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="93" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#fda4af" text-anchor="middle">Kịch bản kích hoạt</text>
      <text x="12" y="46" font-family="monospace" font-size="9" fill="#38bdf8">.github/workflows/</text>
      <text x="12" y="62" font-family="monospace" font-size="9" fill="#fef08a">ci.yml</text>
      <line x1="12" y1="74" x2="174" y2="74" stroke="#334155"/>
      <text x="12" y="94" font-family="monospace" font-size="8" fill="#cbd5e1">name: Java Spring</text>
      <text x="12" y="110" font-family="monospace" font-size="8" fill="#cbd5e1">      Boot CI (Gradle)</text>
      <text x="12" y="132" font-family="monospace" font-size="8" fill="#cbd5e1">on:</text>
      <text x="12" y="148" font-family="monospace" font-size="8" fill="#cbd5e1">  push:</text>
      <text x="12" y="164" font-family="monospace" font-size="8" fill="#cbd5e1">    branches:</text>
      <text x="12" y="180" font-family="monospace" font-size="8" fill="#fef08a">      [ "main" ]</text>
    </g>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 245 285 L 275 285" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="275,280 285,285 275,290" fill="#f43f5e"/>

  <!-- Step 2: GitHub Runner Environment -->
  <g transform="translate(285, 105)">
    <rect width="455" height="380" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="455" height="40" rx="12" fill="url(#runGrad)"/>
    <text x="227" y="26" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2. GITHUB HOSTED RUNNER: ubuntu-latest (Job: test)</text>

    <!-- 4 Pipeline Steps inside runner -->
    <g transform="translate(15, 50)">
      <!-- Step 1 -->
      <rect width="425" height="65" rx="7" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
      <circle cx="25" cy="32" r="12" fill="#8b5cf6"/>
      <text x="25" y="36" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
      <text x="48" y="25" font-family="sans-serif" font-size="11" font-weight="700" fill="#e0e7ff">Checkout mã nguồn</text>
      <text x="48" y="42" font-family="monospace" font-size="9" fill="#93c5fd">uses: actions/checkout@v5</text>
      <text x="48" y="55" font-family="sans-serif" font-size="8.5" fill="#94a3b8">Kéo toàn bộ commit và branch vào thư mục workspace</text>

      <!-- Step 2 -->
      <g transform="translate(0, 75)">
        <rect width="425" height="75" rx="7" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
        <circle cx="25" cy="37" r="12" fill="#8b5cf6"/>
        <text x="25" y="41" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
        <text x="48" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#e0e7ff">Thiết lập môi trường Java JDK 17</text>
        <text x="48" y="40" font-family="monospace" font-size="9" fill="#93c5fd">uses: actions/setup-java@v5</text>
        <text x="48" y="54" font-family="monospace" font-size="8.5" fill="#fef08a">java-version: '17' | distribution: 'temurin'</text>
        <text x="48" y="67" font-family="sans-serif" font-size="8" fill="#94a3b8">Cài đặt Eclipse Temurin OpenJDK 17 chính thức</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 160)">
        <rect width="425" height="68" rx="7" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
        <circle cx="25" cy="34" r="12" fill="#8b5cf6"/>
        <text x="25" y="38" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
        <text x="48" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#e0e7ff">Cấp quyền cho Gradle Wrapper</text>
        <text x="48" y="42" font-family="monospace" font-size="9.5" fill="#38bdf8">run: chmod +x gradlew</text>
        <text x="48" y="58" font-family="sans-serif" font-size="8.5" fill="#94a3b8">Bổ sung quyền Execute để script chạy mượt trên Linux</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 238)">
        <rect width="425" height="75" rx="7" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
        <circle cx="25" cy="37" r="12" fill="#10b981"/>
        <text x="25" y="41" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
        <text x="48" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">Thực thi JUnit Test với Gradle</text>
        <text x="48" y="42" font-family="monospace" font-size="10" font-weight="700" fill="#fef08a">run: ./gradlew test</text>
        <text x="48" y="60" font-family="sans-serif" font-size="8.5" fill="#6ee7b7">Tự động biên dịch, quét JUnit và xuất báo cáo kiểm thử</text>
      </g>
    </g>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 740 285 L 770 285" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="770,280 780,285 770,290" fill="#10b981"/>

  <!-- Step 3: Verification & Success -->
  <g transform="translate(780, 105)">
    <rect width="185" height="380" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8" filter="url(#shadow)"/>
    <rect width="185" height="40" rx="12" fill="url(#okGrad)"/>
    <text x="92" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3. KẾT QUẢ CI</text>

    <!-- Success Badge -->
    <g transform="translate(12, 55)">
      <rect width="161" height="120" rx="8" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="80" cy="38" r="22" fill="#10b981"/>
      <path d="M 71 38 L 77 44 L 90 31" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="80" font-family="sans-serif" font-size="12" font-weight="700" fill="#6ee7b7" text-anchor="middle">SUCCESS</text>
      <text x="80" y="98" font-family="sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">Trạng thái Tích Xanh</text>
    </g>

    <g transform="translate(12, 190)">
      <rect width="161" height="165" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="80" y="22" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#fbbf24" text-anchor="middle">JUnit Test Summary</text>
      <text x="15" y="48" font-family="monospace" font-size="8.5" fill="#34d399">Tests: 2 passed</text>
      <text x="15" y="68" font-family="monospace" font-size="8.5" fill="#34d399">Failures: 0</text>
      <text x="15" y="88" font-family="monospace" font-size="8.5" fill="#34d399">Errors: 0</text>
      <text x="15" y="108" font-family="monospace" font-size="8.5" fill="#34d399">Skipped: 0</text>
      <line x1="12" y1="120" x2="149" y2="120" stroke="#334155"/>
      <text x="80" y="140" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">BUILD SUCCESSFUL</text>
    </g>
  </g>

  <!-- Bottom workflow summary -->
  <g transform="translate(35, 505)">
    <rect width="930" height="95" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">TỔNG QUAN QUY TRÌNH CONTINUOUS INTEGRATION (CI):</text>
    <text x="30" y="50" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">• Mọi commit đẩy lên nhánh main đều được tự động xác thực bằng bộ bài test JUnit trên hạ tầng đám mây GitHub.</text>
    <text x="30" y="70" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">• Gradle Wrapper đảm bảo tính độc lập môi trường, không phụ thuộc vào việc máy chủ có cài sẵn Gradle hay không.</text>
  </g>
</svg>
